name: Data Preprocessing Workflow

on:
  push:
    branches: [ main ]
    paths:
      - '**' # Memastikan berkas apa pun yang di-push akan otomatis memicu run
  workflow_dispatch: # Tetap mempertahankan tombol manual jika sewaktu-waktu butuh

jobs:
  run-preprocessing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy

    - name: Run Preprocessing Script
      run: |
        python preprocessing/automate_Dika-Ramadani.py

    - name: Upload Preprocessed Artifact
      uses: actions/upload-artifact@v4
      with:
        name: preprocessed-dataset
        path: preprocessing/porter-delivery-time-estimation_preprocessing/porter_delivery_preprocessed.csv